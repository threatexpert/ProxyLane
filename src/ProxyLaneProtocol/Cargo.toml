[package]
name = "proxylane_protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[[bin]]
name = "proxylane-protocol"
path = "src/main.rs"

[dependencies]
hickory-proto = { version = "=0.24.4", default-features = false }
base64 = "=0.22.1"
fs2 = "=0.4.3"
getrandom = "=0.2.17"
httparse = "=1.10.1"
httlib-hpack = "=0.1.3"
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
brotli = { version = "=8.0.2", features = ["disallow_large_window_size"] }
zstd = { version = "=0.13.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
