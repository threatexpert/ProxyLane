[package]
name = "proxylane_secure_transport"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes = "0.8.4"
base64ct = "=1.6.0"
ctr = "0.9.2"
getrandom = "0.2.16"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["pkcs8"] }
rcgen = "0.13.1"
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10.8"
time = "=0.3.36"
x509-parser = "0.16.0"
zeroize = "=1.8.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
