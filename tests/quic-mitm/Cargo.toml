[package]
name = "proxylane-quic-mitm-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
proxylane_mitm = { path = "../../src/ProxyLaneMitm" }
quinn = { version = "=0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
bytes = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
